<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诊断报告</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #f5f5f5;
            padding: 16px;
        }
        .container {
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            max-width: 480px;
            margin: 0 auto;
        }
        .header-top {
            background-color: #eeeeee;
            text-align: center;
            padding: 18px 0;
        }
        .header-top h1 {
            font-size: 22px;
            font-weight: 500;
            color: #222;
        }
        .title-row {
            text-align: center;
            padding: 24px 12px;
            font-size: 20px;
            font-weight: 600;
            color: #222;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #e8e8e8;
            font-size: 17px;
        }
        .info-label {
            color: #333;
        }
        .info-value {
            color: #222;
        }
        .grey-block {
            background-color: #eeeeee;
            height: 42px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-top">
            <h1>诊断报告</h1>
        </div>
        <div class="title-row">
            汕头市澄海区人民医院放射报告单
        </div>
        <div class="info-row">
            <span class="info-label">检查编号</span>
            <span class="info-value">F1130622</span>
        </div>
        <div class="info-row">
            <span class="info-label">姓名</span>
            <span class="info-value">卢谨源</span>
        </div>
        <div class="info-row">
            <span class="info-label">年龄</span>
            <span class="info-value">20 岁</span>
        </div>
        <div class="info-row">
            <span class="info-label">性别</span>
            <span class="info-value">男</span>
        </div>
        <div class="grey-block"></div>
        <div class="info-row">
            <span class="info-label">检查部位</span>
            <span class="info-value">DR(口腔)-颌全景</span>
        </div>
        <div class="info-row">
            <span class="info-label">检查所见</span>
            <span class="info-value">请口腔科医生自阅。</span>
        </div>
        <div class="info-row">
            <span class="info-label">诊断所得</span>
            <span class="info-value"></span>
        </div>
        <div class="grey-block"></div>
        <div class="info-row">
            <span class="info-label">报告医生</span>
            <span class="info-value">王开平</span>
        </div>
        <div class="info-row">
            <span class="info-label">报告日期</span>
            <span class="info-value">2026-09-25 15:33:15</span>
        </div>
        <div class="info-row">
            <span class="info-label">审核医生</span>
            <span class="info-value">王开平</span>
        </div>
        <div class="info-row">
            <span class="info-label">审核日期</span>
            <span class="info-value">2026-09-25 15:33:15</span>
        </div>
    </div>
</body>
</html>
